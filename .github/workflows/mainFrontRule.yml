name: Deploy to Preproduction Frontend

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main-Front

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4

      - name: Validar Branch de origem
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" != "hml-Front" ]]; then
            echo "❌ ERRO: A branch de origem ('$HEAD_REF') não é 'hml-Front'. Merge bloqueado!"
            exit 1
          fi
          echo "✅ Branch de origem é '$HEAD_REF' — liberado."

      - name: Executar Logs e Deploy
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Branch de origem: $HEAD_REF"
          echo "Branch de destino: $BASE_REF"
          echo "Fazendo deploy..."
