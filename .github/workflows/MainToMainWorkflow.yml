name: Deploy to Production

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4

      - name: Validar Branch de origem
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$HEAD_REF" in
            main-Back|main-Front|main-Edge)
              echo "✅ Branch de origem é '$HEAD_REF' — liberado."
              ;;
            *)
              echo "❌ ERRO: A branch de origem ('$HEAD_REF') não é main-Back, main-Front nem main-Edge. Merge bloqueado!"
              exit 1
              ;;
          esac

      - name: Executar Logs e Deploy
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Branch de origem: $HEAD_REF"
          echo "Branch de destino: $BASE_REF"
          echo "Fazendo deploy..."
